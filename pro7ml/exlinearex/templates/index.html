<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 연봉 예측 시스템</title>
    <style>
        /* 1. 배경 애니메이션: 움직이는 그라데이션 */
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. 메인 컨테이너: 유리 질감(Glassmorphism) */
        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            margin-top: 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 500px;
            text-align: center;
        }

        h2, h3 { text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* 3. 입력창 & 버튼: 네온 스타일 */
        input[name="year"] {
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            width: 150px;
            font-size: 1.1em;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        button#clickBtn {
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        button#clickBtn:hover {
            background: #a29bfe;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }

        /* 4. 결과창: 네온 보더 효과 */
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            min-height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 5px solid #23d5ab;
            text-align: left;
            transition: all 0.5s ease;
        }

        #result p { margin: 10px 0; font-size: 1.1em; }

        /* 5. 테이블: 모던 다크 테마 */
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background-color: rgba(255, 255, 255, 0.3);
            padding: 15px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 AI 연봉 예측 시스템</h2>
    <p style="font-size: 0.9em; opacity: 0.8;">Linear Regression Model Analysis</p>
    
    <div style="margin-top: 20px;">
        근무년수 : <input type="number" name="year" placeholder="ex) 5">
        <button type="submit" id="clickBtn">예측하기</button>
    </div>

    <div id="result">
        <p style="text-align: center; color: #ddd;">데이터를 입력하고 버튼을 누르세요.</p>
    </div>

    <h3 style="margin-top: 40px;">📊 직급별 연봉 평균 현황</h3>
    <table>
        <thead>
            <tr>
                <th>직급</th>
                <th>연봉 평균</th>
            </tr>
        </thead>
        <tbody>
            {% for jik, pay in jikpay.items() %}
            <tr>
                <td>{{jik}}</td>
                <td><span style="font-weight: bold; color: #ffeaa7;">{{pay}}</span> 만원</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    document.getElementById('clickBtn').addEventListener('click', function() {
        const year = document.querySelector('input[name="year"]').value;
        if(!year) { alert("년수를 입력해주세요!"); return; }

        const resultDiv = document.getElementById('result');
        resultDiv.style.opacity = '0.5'; // 통신 중 효과

        fetch('/predict?year=' + year)
        .then(response => response.json())
        .then(data => {
            resultDiv.style.opacity = '1';
            resultDiv.innerHTML = `
                <p>💰 <span style="color:#fab1a0">예상 연봉 :</span> <strong>${data.predpay}</strong> 만원</p>
                <p>📈 <span style="color:#55efc4">설명력(R²) :</span> <strong>${data.r2_score}</strong>%</p>
                <p>📝 <span style="color:#81ecec">회귀식 :</span> <small>pay = ${data.coef} * years + (${data.intercept})</small></p>
            `;
        })
        .catch(error => {
            console.error('Error:', error);
            resultDiv.innerHTML = "<p style='color: #ff7675;'>데이터 로드 오류</p>";
        });
    });
</script>
</body>
</html>
