<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coffeesurvey</title>
</head>
<body>
<h3>커피 전문점에 대한 소비자 인식 조사</h3>
<form action="/coffee/surveyprocess" method="post">
    <table>
        <tr>
            <td>귀하의 성별은 무엇입니까?</td>
            <td>
                <label for="genM">남자</label>
                <input type="radio" name="gender" id="genM" value="남" checked>
                &nbsp;&nbsp;
                <label for="genF">여자</label>
                <input type="radio" name="gender" id="genF" value="여">
            </td>
        </tr>
        <tr>
            <td>귀하의 나이는 몇 세입니까?</td>
            <td>
                <label for="age10">10대</label>
                <input type="radio" name="age" id="age10" value="10" checked>
                &nbsp;&nbsp;
                <label for="age20">20대</label>
                <input type="radio" name="age" id="age20" value="20">
                &nbsp;&nbsp;
                <label for="age30">30대</label>
                <input type="radio" name="age" id="age30" value="30">
                &nbsp;&nbsp;
                <label for="age40">40대</label>
                <input type="radio" name="age" id="age40" value="40">
                &nbsp;&nbsp;
                <label for="age50">50대 이상</label>
                <input type="radio" name="age" id="age50" value="50">
            </td>
        <tr>
            <td>귀하가 선호하는 커피 브랜드는 무엇입니까?</td>
            <td>
                <label for="star">스타벅스</label>
                <input type="radio" id="star" name="co_survey" value="스타벅스" checked>
                &nbsp;&nbsp;
                <label for="paul">폴바셋</label>
                <input type="radio" id="paul" name="co_survey" value="폴바셋">
                &nbsp;&nbsp;
                <label for="ediya">이디야</label>
                <input type="radio" id="ediya" name="co_survey" value="이디야">
                &nbsp;&nbsp;
                <label for="tom">탐앤탐스</label>
                <input type="radio" id="tom" name="co_survey" value="탐앤탐스">
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <br>
                <input type="submit" value="설문완료">
                <input type="reset" value="초기화">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
