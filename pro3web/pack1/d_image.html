<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style type="text/css">

     /* 브라우저의 기본 여백을 모두 제거하여 꽉 차게 만듭니다. */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 혹시 모를 스크롤바를 숨깁니다. */
        }
        
        img {
            /* 이미지의 가로/세로를 부모(body) 크기에 100% 맞춥니다. */
            width: 100%;
            height: 100%;
            
            /* 핵심 속성: 이미지 비율을 유지하면서 공간을 꽉 채웁니다. (이미지가 잘릴 수 있음) */
            
        }
</style>
    
    
</head>
<body>
    <img src="images/hyundai.png"/>
</body>
</html>
