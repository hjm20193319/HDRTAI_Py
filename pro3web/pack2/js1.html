<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT</title>
</head>
<body>
<h3>
** 자바 스크립트 **
</h3>
<br> : 클라이언트 사이드 스크립트 <br>
<script>
window.document.write("환영합니다. JS세상");            // -> 한줄 주석 / 브라우저 화면으로 출력
console.log("개발자를 위해 표준 출력 장치로 출력");          // 검사 창 안에 콘솔에 출력
document.write("<h2>브라우저에 문자열 출력</h2>");      //
</script>

다시 HTML로 나옴<br>

<script>
document.write("여기는 자바스크립트");

let a = 10;
let b = a + 10;
document.write("<br>b는 ", b);
</script>

</body>
</html>
