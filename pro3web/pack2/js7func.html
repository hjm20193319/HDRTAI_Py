<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNCTION</title>

    <style>
        @keyframes blink-effect {
          /* 애니메이션의 50% 지점에서 투명도를 0 (완전 투명)으로 만듭니다. */
          50% {
            opacity: 0;
          }
        }

        /* 'blinking-text' 라는 클래스를 가진 요소에 애니메이션을 적용합니다. */
        .blinktest {
          animation: blink-effect 0.3s infinite;
          color: deeppink;
          font-style: italic;
          font-family: 굴림;
          /*
             - blink-effect: 위에서 만든 애니메이션 이름
             - 1s: 애니메이션이 한 번 실행되는 데 걸리는 시간 (1초)
             - step-end: 애니메이션을 부드럽게가 아니라 탁탁 끊어지게 만듦 (깜빡이는 느낌)
             - infinite: 애니메이션을 무한 반복
          */
        }

    </style>

    <script type="text/javascript">
    function bb() {
        document.write(`bb 함수 실행 성공`);
        cc(5);              // 함수가 다른 함수 호출 가능(반환값 무시)
        // return: 함수 무조건 탈출
        let re = cc(5);
        document.write(`<br>re는 ${re}`);

        // dd 함수 선언
        dd(7, 8);
        dd(7,8,9);      // 세번째 인자는 자동 무시
        dd(7);          // 모자르게 주면 undefined

        // js는 일급객체 지원 - python 과 동일
        // 함수가 함수 호출 가능, 매개변수 함수 전달 가능, 반환값 함수 가능


    }

    function cc(para) {         // 매개변수가 있는 함수
        let kk = para + 10;
        document.write(`<br>kk는 ${kk}`);
        return kk;              // 반환값은 1개만 가능
    }

    function dd(para1, para2) {
        document.write(`<br> dd 함수에서 ${para1} ${para2}`);
    }

    // 전역, 지역 변수
        let a = 100;        // 전역 변수
        const b = 200;      // 전역 상수

        function func() {
            let c = 300;        // 지역 변수
            const d = 400;      // 지역 상수
            document.write(`<br>a: ${a} b:${b}`);
            document.write(`<br>c:${c} d:${d}`);
        }

    </script>

</head>
<body>
<h3>** 함수(function) **</h3><hr>
<pre>
: 어떤 특별한 목적의 작업을 수행하도록 설계된 독립적 블록{ }을 의미
</pre>
<script>
// 내장 함수 : js 가 기본 지원
let str = 'Java Script Language';
document.write(`<br>str.charAt(2) : ${str.charAt(2)}`);

document.write(`<br>str.bold() : ${str.bold()}`);       // bold : 굵어지게 하는 내장 함수

document.write(`<br>Math.abs(-7) : ${Math.abs(-7) }`)
// ... 무수히 많은 내장 함수 존재...
</script>
<hr>
<h4>** 사용자 정의 함수 **</h4><br>
<script>
let count = 0;
function aa() {             // 일반 함수 선언 
    count += 1;
    document.write(count + '번 수행<br>');
}
aa();       // 함수 실행
document.write('뭔가를 하다가...<br>');
aa();       // 함수 실행------count 는 전역 변수 이기 때문에 2로 늘어남
// 계속 반복되는 형식은 별도의 함수로 만들어서 불러와서 사용해야한다
document.write('함수는 참조형 타입 : ', typeof(aa));
</script>
<div>오늘은 금요일 : 한 잔 땡겨도 좋은 날</div>
<script>
aa();       // 함수 세번째 수행
</script>
<hr>
<div><b>생각의 전환 : html 선언부에 js 코드(함수) 작성 후 함수 호출하기</b></div>
<script>
bb();       // 따로 작성한 함수 호출 및 실행

cc(20);
document.write(`<br>`);

document.write(`---전역, 지역 변수---`)
func();
document.write(`<br><br>a: ${a} b:${b}`);       // 출력 성공 --- 전역 변수
// document.write(`<br>c:${c} d:${d}`);            // reference error : 지역 변수
</script>
<p><h2 class="blinktest">
    아 집 가고 싶다
</h2></p>
</body>
</html>
