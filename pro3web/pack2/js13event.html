<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event3</title>
    <script type="text/javascript">
        function func1(){
           // alert('a');
            document.getElementById('show').innerHTML = '전통적인 이벤트 처리'
        }

        let a = 10;
        let b = {
            funcNew1:function(){
                document.getElementById('show').innerHTML = 'b 객체의 메소드 처리';
            },
        
            funcNew2:function(){
                document.getElementById('show').innerHTML = '<h4>b 객체의 멤버 수행</h4>';
            }
        }
    </script>
    <script>
        // window.onload = alert('ok');        // load event가 발생 : 
        window.onload = function(){             // 서버로부터 문서 수신이 완료되면 load 이벤트(함수) 발생---1회용, 초기화 담당, callback Fx
            alert('ok');
            const exBtn1 = document.getElementById('btn1');         // 특정 버튼을 읽어, 변수에 기억시킴, id로 읽어옴
            exBtn1.onclick = function(){                    // 이벤트 장착
                document.getElementById('show').innerHTML = '클릭 1 선택';
            }

            const exBtn2 = document.getElementsByName('myBtn');     // 배열에 기억(같은 이름이 복수개여서)
            console.log(exBtn2.length);
            exBtn2[0].onclick = function(){
                document.getElementById('show').innerHTML = '<i>클릭2 누름</i>';
            }
            exBtn2[1].onclick = function(){
                document.getElementById('show').innerHTML = '<i>클릭3 누르다니</i>';
            }

            const exBtn4 = document.getElementsByTagName('button')[3];          // tag로 불렀다
            exBtn4.onclick = function(){
                document.getElementById('show').innerHTML = '<b>클릭4 선택함</b>';
            }

            // 이벤트 연결 및 해제
            // addEventListener('이벤트종류', 핸들러 함수)
            document.getElementById('btn5').addEventListener('click', abcFunc);     // 이벤트 연결
        }

        function abcFunc(){
            // alert('abc');
            document.getElementById('show').innerHTML = '클릭5 이벤트 연결 처리';

            document.getElementById('btn5').removeEventListener('click', abcFunc);      // 이벤트 해제
        }
    </script>


</head>
<body>
<h4>** 이벤트 처리 : 이벤트 핸들러 연결 **</h4>
<input type="button" value="버튼 1" onclick="func1()"><br>
<input type="button" value="버튼 2" onclick="b.funcNew1()"><br>
<input type="button" value="버튼 3" onclick="b.funcNew2()"><br>
<hr>
<!--
<button id="btn1" onclick="이벤트처리함수()">클릭 1</button><br>
-->
<button id="btn1">클릭 1</button><br>
<button id="btn2" name="myBtn">클릭 2</button><br>      <!-- 이름이 같으면 자동으로 배열-->
<button id="btn3" name="myBtn">클릭 3</button><br>
<button id="btn4">클릭 4</button><br>
<button id="btn5">클릭 5</button><br>
<div id="show"></div>
</body>
</html>
