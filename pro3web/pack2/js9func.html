<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화살표함수</title>
</head>
<body>
<pre>
Es6 부터는 화살표 함수(arrow function)라는 새로운 문법 방식으로 함수를 만들 수 있음
화살표 함수는 => 기호 사용해서 function 키워드 생략
함수 표현식보다 단순한 문법으로 함수 처리 가능

형식 : let 변수 = (매개변수1,....) => {표현식}      표현식이 하나이면 중괄호 빼기
</pre>
<script>
'use strict';       /* ecma6 이후 문법을 사용하겠단 뜻 */

function sum0(a, b) {                   /* function 방식1 */
    return a + b;
}
document.write(sum0(1, 3));

let sum1 = function(a, b) {             /* function 방식2*/
    return a + b;
}
document.write(sum1(1, 3));

let sum2 = (a, b) => a + b          /* 화살표 함수, 수행문이 하나일 때 */
document.write(sum2(1, 3));

let sum3 = (a, b) => {return a + b}         /* return을 쓸때는 {  } 사용하기 */
document.write(sum3(1, 3));

let double1 = n => n * 2;       /* let double1 = (n) => {return n * 2} 와 동일 */
document.write(`<br>결과는 ${double1(3)}`);

let sayHi = () => document.write(`<br>안녕하세요`);         /* 매개변수가 없을땐 ( ) 생략 불가 */
sayHi();

let age = 25;
let welcome = (age < 30)?()=>document.write(`<br>안녕`):document.write(`<br>반가워`);       /* 참이면 왼쪽 거짓이면 오른쪽 */
welcome();

document.write(`<br>`)
let sumFunc = (a, b) => {
    let result = a + b;
    return result;
}
document.write(`두 수의 합은 ${sumFunc(5, 6)}`);
</script>
</body>
</html>
